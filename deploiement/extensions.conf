; Plan de numérotation — l'appel entrant part vers le standard.
;
; Asterisk 18 ou plus récent, avec app_audiosocket chargé.
; L'UUID identifie l'appel de bout en bout : c'est lui qu'on retrouve au journal
; quand un commerçant demande « que s'est-il passé sur cet appel-là ».

[entrant]
exten => _X.,1,NoOp(Appel entrant vers le standard automatique)
 same => n,Answer()
 same => n,Set(APPEL_UUID=${UUID()})
 same => n,Verbose(1, AudioSocket ${APPEL_UUID} depuis ${CALLERID(num)})
 ; slin = 16 bits, 8 kHz, mono : exactement ce que le serveur attend.
 same => n,Set(CHANNEL(audioreadformat)=slin)
 same => n,Set(CHANNEL(audiowriteformat)=slin)
 same => n,AudioSocket(${APPEL_UUID},127.0.0.1:8090)
 same => n,Hangup()

; Transfert vers un humain : le serveur ferme la connexion en demandant la main,
; et le plan reprend ici plutôt que de raccrocher au nez de l'appelant.
exten => h,1,NoOp(Fin d'appel ${APPEL_UUID})
