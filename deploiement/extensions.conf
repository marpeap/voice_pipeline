; Plan de numérotation — l'appel entrant part vers le standard.
;
; Asterisk 18 ou plus récent, avec app_audiosocket chargé.
; L'UUID identifie l'appel de bout en bout : c'est lui qu'on retrouve au journal
; quand un commerçant demande « que s'est-il passé sur cet appel-là », et c'est
; lui qui sert à demander au standard comment l'appel s'est terminé.
;
; Ce que la version précédente faisait mal, et qui ne se voyait pas :
;   - un TRANSFERT demandé par l'agent raccrochait au nez de l'appelant, alors
;     que le serveur ferme la connexion précisément pour rendre la main ;
;   - le standard arrêté, ou au plafond d'appels simultanés (il rend la ligne
;     tout de suite), donnait un appel qui décroche et ne dit rien ;
;   - basculer par défaut vers le salon aurait renvoyé les démarcheurs filtrés.
;
; D'où la demande d'issue : « transfert » (ou pas de réponse du tout, standard
; injoignable) renvoie vers le poste ; « demarchage » et « fin » raccrochent.

[globals]
POSTE_DU_SALON=PJSIP/poste-salon   ; à remplacer par le poste réel
STANDARD_SANTE=127.0.0.1:8092

[entrant]
exten => _X.,1,NoOp(Appel entrant vers le standard automatique)
 same => n,Answer()
 same => n,Set(APPEL_UUID=${UUID()})
 same => n,Verbose(1, AudioSocket ${APPEL_UUID} depuis ${CALLERID(num)})
 ; L'identifiant d'appelant ne passe PAS par AudioSocket : on le dépose ici,
 ; avant de brancher l'audio. Le standard ne garde que ce qui ressemble à un
 ; numéro français — « anonymous » et « unknown » sont ignorés —, et il le
 ; redira toujours à voix haute avant d'envoyer quoi que ce soit.
 same => n,Set(DEPOT=${CURL(http://${STANDARD_SANTE}/appelant/${APPEL_UUID}?numero=${CALLERID(num)})})
 ; slin = 16 bits, 8 kHz, mono : exactement ce que le serveur attend.
 same => n,Set(CHANNEL(audioreadformat)=slin)
 same => n,Set(CHANNEL(audiowriteformat)=slin)
 same => n,AudioSocket(${APPEL_UUID},127.0.0.1:8090)

 ; L'agent a rendu la main — ou n'a jamais répondu. On demande pourquoi.
 same => n,Set(ISSUE=${CURL(http://${STANDARD_SANTE}/issue/${APPEL_UUID})})
 same => n,Verbose(1, Issue ${APPEL_UUID} = ${ISSUE})
 same => n,GotoIf($["${ISSUE}" = "demarchage"]?fin)
 same => n,GotoIf($["${ISSUE}" = "fin"]?fin)
 ; « transfert », « inconnu », ou pas de réponse : le poste du salon sonne.
 ; Le défaut penche du bon côté — un standard injoignable ne doit pas faire
 ; perdre l'appel, il doit le rendre au salon.
 same => n(humain),Dial(${POSTE_DU_SALON},25)
 same => n,Hangup()

 same => n(fin),Hangup()

exten => h,1,NoOp(Fin d'appel ${APPEL_UUID})
