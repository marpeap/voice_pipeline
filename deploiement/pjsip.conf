; Point de terminaison SIP — codecs volontairement restreints.
;
; Relevé le 19/09/2026 : restreindre les codecs (alaw, ulaw, slin16) évite les
; problèmes de négociation, première cause d'appels qui aboutissent muets. On ne
; laisse donc pas Asterisk négocier tout ce qu'il connaît.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

[operateur]
type=endpoint
context=entrant
disallow=all
allow=ulaw
allow=alaw
direct_media=no          ; l'audio doit passer par nous, sinon AudioSocket ne voit rien

[operateur-auth]
type=auth
auth_type=userpass
username=a-remplir
password=a-remplir-par-le-coffre

[operateur-aor]
type=aor
contact=sip:sip.operateur.example:5060
