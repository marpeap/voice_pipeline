[project]
name = "standard-telephonique"
version = "0.1.0"
description = "Un assistant téléphonique qui répond, et qui n'annonce jamais un rendez-vous qui n'existe pas."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["standard"]
